<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .product-id {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .field {
            margin-bottom: 25px;
        }
        
        .label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .value {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            padding: 12px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        
        .no-data {
            color: #999;
            font-style: italic;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="product-name">Product Name</h1>
        <div class="product-id" id="product-id">SKU-000</div>
        
        <div class="field">
            <div class="label">Description</div>
            <div class="value" id="product-description">No description provided</div>
        </div>
        
        <div class="field">
            <div class="label">Category</div>
            <div class="value" id="product-category">No category provided</div>
        </div>
        
        <div class="field">
            <div class="label">Price</div>
            <div class="value" id="product-price">No price provided</div>
        </div>
        
        <div class="field">
            <div class="label">Stock</div>
            <div class="value" id="product-stock">No stock information</div>
        </div>
        
        <div class="footer">
            Scanned from QR Code
        </div>
    </div>

    <script>
        // Get URL parameters
        function getParameter(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return decodeURIComponent(urlParams.get(param)) || '';
        }
        
        // Populate the page with data from URL
        document.getElementById('product-name').textContent = getParameter('name') || 'Product Name';
        
        const id = getParameter('id');
        if (id) {
            document.getElementById('product-id').textContent = id;
        }
        
        const description = getParameter('description');
        document.getElementById('product-description').textContent = description || 'No description provided';
        document.getElementById('product-description').className = description ? 'value' : 'value no-data';
        
        const category = getParameter('category');
        document.getElementById('product-category').textContent = category || 'No category provided';
        document.getElementById('product-category').className = category ? 'value' : 'value no-data';
        
        const price = getParameter('price');
        document.getElementById('product-price').textContent = price || 'No price provided';
        document.getElementById('product-price').className = price ? 'value' : 'value no-data';
        
        const stock = getParameter('stock');
        document.getElementById('product-stock').textContent = stock || 'No stock information';
        document.getElementById('product-stock').className = stock ? 'value' : 'value no-data';
    </script>
</body>
</html>
