<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .product-id {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .field {
            margin-bottom: 25px;
        }
        
        .label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .value {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            padding: 12px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        
        .no-data {
            color: #999;
            font-style: italic;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="product-pn">Product Number</h1>
        
        <div class="field">
            <div class="label">Description</div>
            <div class="value" id="product-description">No description provided</div>
        </div>
        
        <div class="field">
            <div class="label">Width (W)</div>
            <div class="value" id="product-width">No width provided</div>
        </div>
        
        <div class="field">
            <div class="label">Length</div>
            <div class="value" id="product-length">No length provided</div>
        </div>
        
        <div class="field">
            <div class="label">Location</div>
            <div class="value" id="product-location">No location provided</div>
        </div>
        
        <div class="footer">
            Scanned from QR Code
        </div>
    </div>

    <script>
        // Get URL parameters
        function getParameter(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return decodeURIComponent(urlParams.get(param)) || '';
        }
        
        // Populate the page with data from URL
        const pn = getParameter('pn');
        document.getElementById('product-pn').textContent = pn || 'Product Number';
        
        const description = getParameter('description');
        document.getElementById('product-description').textContent = description || 'No description provided';
        document.getElementById('product-description').className = description ? 'value' : 'value no-data';
        
        const width = getParameter('width');
        document.getElementById('product-width').textContent = width || 'No width provided';
        document.getElementById('product-width').className = width ? 'value' : 'value no-data';
        
        const length = getParameter('length');
        document.getElementById('product-length').textContent = length || 'No length provided';
        document.getElementById('product-length').className = length ? 'value' : 'value no-data';
        
        const location = getParameter('location');
        document.getElementById('product-location').textContent = location || 'No location provided';
        document.getElementById('product-location').className = location ? 'value' : 'value no-data';
    </script>
</body>
</html>
