<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        
        .field {
            margin-bottom: 25px;
        }
        
        .label {
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .value {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            min-height: 30px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Details</h1>
        
        <div class="field">
            <div class="label">Product Number (PN)</div>
            <div class="value" id="pn">-</div>
        </div>
        
        <div class="field">
            <div class="label">Description</div>
            <div class="value" id="description">-</div>
        </div>
        
        <div class="field">
            <div class="label">Width (W)</div>
            <div class="value" id="width">-</div>
        </div>
        
        <div class="field">
            <div class="label">Length (L)</div>
            <div class="value" id="length">-</div>
        </div>
        
        <div class="field">
            <div class="label">Location</div>
            <div class="value" id="location">-</div>
        </div>
        
        <div class="footer">
            Scanned from QR Code
        </div>
    </div>

    <script>
        // Get URL parameters
        function getParam(name) {
            const url = window.location.href;
            const regex = new RegExp('[?&]' + name + '=([^&#]*)');
            const results = regex.exec(url);
            return results === null ? '' : decodeURIComponent(results[1]);
        }
        
        // Set values from URL
        document.getElementById('pn').innerText = getParam('pn') || '-';
        document.getElementById('description').innerText = getParam('description') || '-';
        document.getElementById('width').innerText = getParam('width') || '-';
        document.getElementById('length').innerText = getParam('length') || '-';
        document.getElementById('location').innerText = getParam('location') || '-';
    </script>
</body>
</html>
